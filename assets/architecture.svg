    <text x="972" y="464" fill="#e6f8ff" font-size="12">⚙ monitors</text>
    <text x="984" y="480" fill="#8aa8c0" font-size="10">tsc-watch build errors</text>
    <text x="984" y="494" fill="#8aa8c0" font-size="10">dev-log ERROR/WARN tail</text>
    <text x="972" y="520" fill="#e6f8ff" font-size="12">⚙ mcp-catalog</text>
    <text x="984" y="536" fill="#8aa8c0" font-size="10">github · playwright · postgres</text>
    <text x="984" y="550" fill="#8aa8c0" font-size="10">opt-in per project, no auto-connect</text>
    <text x="972" y="582" fill="#e6f8ff" font-size="12">⚙ .claude/ (versioned config)</text>
    <text x="984" y="598" fill="#8aa8c0" font-size="10">settings.json + scripts, ~-based</text>
    <text x="984" y="612" fill="#8aa8c0" font-size="10">paths: clone + copy = new machine</text>
    <text x="972" y="643" fill="#a78bfa" font-size="10" opacity="0.8">loaded when plugins are enabled,</text>
    <text x="972" y="657" fill="#a78bfa" font-size="10" opacity="0.8">work transparently in background</text>
