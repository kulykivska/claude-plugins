    <line x1="368" y1="380" x2="600" y2="380" stroke="#fbbf24" stroke-width="0.8" opacity="0.6"/>

    <text x="356" y="406" fill="#e6f8ff" font-size="12">⬡ architect</text>
    <text x="368" y="420" fill="#8aa8c0" font-size="10">design + file-level plan before code</text>
    <text x="356" y="443" fill="#e6f8ff" font-size="12">⬡ debugger</text>
    <text x="368" y="457" fill="#8aa8c0" font-size="10">root cause from logs and evidence</text>
    <text x="356" y="480" fill="#e6f8ff" font-size="12">⬡ python-reviewer</text>
    <text x="368" y="494" fill="#8aa8c0" font-size="10">FastAPI · async · failure paths</text>
    <text x="356" y="517" fill="#e6f8ff" font-size="12">⬡ web-reviewer</text>
    <text x="368" y="531" fill="#8aa8c0" font-size="10">React/TS · i18n · access gating</text>
    <text x="356" y="554" fill="#e6f8ff" font-size="12">⬡ swiftui-reviewer</text>
    <text x="368" y="568" fill="#8aa8c0" font-size="10">crash risk · StoreKit · l10n</text>
    <text x="356" y="591" fill="#e6f8ff" font-size="12">⬡ ml-reviewer</text>
    <text x="368" y="605" fill="#8aa8c0" font-size="10">LORO gate · leakage · FEATURE_COLS</text>
    <text x="356" y="636" fill="#fbbf24" font-size="10" opacity="0.8">fresh context each, run in parallel,</text>
    <text x="356" y="650" fill="#fbbf24" font-size="10" opacity="0.8">report back to the main session</text>
  </g>

  <!-- ===== PANEL 3 : HOOKS ===== -->
  <g>
    <rect x="646" y="340" width="292" height="330" rx="8" fill="url(#panelFill)" stroke="#f87171" stroke-width="1"/>
    <path d="M646,340 h18 M646,340 v18 M938,340 h-18 M938,340 v18 M646,670 h18 M646,670 v-18 M938,670 h-18 M938,670 v-18" stroke="#fca5a5" stroke-width="2" fill="none"/>
    <text x="792" y="368" text-anchor="middle" fill="#fca5a5" font-size="14" letter-spacing="2" filter="url(#glow)">HOOKS · AUTOMATIC</text>
    <line x1="676" y1="380" x2="908" y2="380" stroke="#f87171" stroke-width="0.8" opacity="0.6"/>

    <text x="664" y="406" fill="#f87171" font-size="12">⛔ guardrails · BLOCKING</text>
    <text x="676" y="421" fill="#8aa8c0" font-size="10">fly destroy / scale-0 / secrets unset</text>
    <text x="676" y="435" fill="#8aa8c0" font-size="10">DROP·TRUNCATE via db clients</text>
    <text x="676" y="449" fill="#8aa8c0" font-size="10">force-push to main · AI attribution</text>
    <text x="676" y="463" fill="#8aa8c0" font-size="10">secrets + PII scan of diffs</text>
    <text x="664" y="490" fill="#7ff3ff" font-size="12">◈ coach · non-blocking</text>
    <text x="676" y="505" fill="#8aa8c0" font-size="10">edit nudges (py/ts/swift · no dashes)</text>
    <text x="676" y="519" fill="#8aa8c0" font-size="10">session banner · failure hints</text>
    <text x="676" y="533" fill="#8aa8c0" font-size="10">uncommitted-changes reminder</text>
    <text x="664" y="560" fill="#fde68a" font-size="12">⛔ pre-push gate</text>
    <text x="676" y="575" fill="#8aa8c0" font-size="10">user-level hook, versioned here in</text>
    <text x="676" y="589" fill="#8aa8c0" font-size="10">.claude/scripts/ · blocks git push</text>
    <text x="676" y="603" fill="#8aa8c0" font-size="10">until pre-push-review approves HEAD</text>
    <text x="664" y="636" fill="#f87171" font-size="10" opacity="0.8">fire on events, no one calls them:</text>
    <text x="664" y="650" fill="#f87171" font-size="10" opacity="0.8">exit 2 vetoes the action</text>
  </g>

