    <text x="48" y="408" fill="#e6f8ff" font-size="12">▸ pre-push-review</text>
    <text x="60" y="424" fill="#4a90b8" font-size="10">fix-and-verify before every push</text>
    <text x="48" y="450" fill="#e6f8ff" font-size="12">▸ morning</text>
    <text x="60" y="466" fill="#4a90b8" font-size="10">daily kickoff recap: git + memory</text>
    <text x="48" y="492" fill="#e6f8ff" font-size="12">▸ sdlc</text>
    <text x="60" y="508" fill="#4a90b8" font-size="10">requirements · plan-task · qa</text>
    <text x="60" y="522" fill="#4a90b8" font-size="10">task-review · debug</text>
    <text x="48" y="548" fill="#e6f8ff" font-size="12">▸ fly-ops</text>
    <text x="60" y="564" fill="#4a90b8" font-size="10">deploy · fly-logs · incident</text>
    <text x="48" y="596" fill="#22d3ee" font-size="10" opacity="0.8">triggered by intent or /command,</text>
    <text x="48" y="610" fill="#22d3ee" font-size="10" opacity="0.8">run inline in the main context</text>
  </g>

  <!-- ===== PANEL 2 : SUBAGENTS ===== -->
  <g>
    <rect x="338" y="340" width="292" height="330" rx="8" fill="url(#panelFill)" stroke="#fbbf24" stroke-width="1"/>
    <path d="M338,340 h18 M338,340 v18 M630,340 h-18 M630,340 v18 M338,670 h18 M338,670 v-18 M630,670 h-18 M630,670 v-18" stroke="#fde68a" stroke-width="2" fill="none"/>
