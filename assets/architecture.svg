  </g>
  <text x="640" y="76" text-anchor="middle" fill="#4a90b8" font-size="12" letter-spacing="3">ONE SOURCE OF TRUTH · EVERY PROJECT · EVERY SESSION</text>
  <path d="M340,88 H560 M720,88 H940" stroke="#22d3ee" stroke-width="1" opacity="0.6"/>
  <circle cx="640" cy="88" r="4" fill="none" stroke="#22d3ee"/>
