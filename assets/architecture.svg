<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 940" font-family="Menlo, SF Mono, Consolas, monospace">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bgGlow" cx="50%" cy="22%" r="80%">
      <stop offset="0%" stop-color="#0e2233"/>
      <stop offset="100%" stop-color="#070d16"/>
    </radialGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1a2b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#081120" stop-opacity="0.95"/>
    </linearGradient>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
